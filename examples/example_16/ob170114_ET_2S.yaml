evolutionary_tracks:
    #brutus_data: e.g. /user/brutus/data/DATAFILES/ 
    # if not set, brutus will be set to the value of the environment variable 'BRUTUS_DATA'
    photometric_map_file: data/OB170114/ob170114_photometric_map.txt 
    # for CMD track plot, if not set,the track will be plotted without the the neighbor stars
    loga_max: 13.
    # maximum log10(a) in Kpc for the Brutus grid, default is 13.
    eep_max: 808
    # maximum EEP for the Brutus grid, default is 808.
    tol: 0.0001
    #  Convergence tolerance (in dex) on the log10(age) match when solvindg for the secondary's EEP in a binary. default is 1e-5.
    sigma_theta_E_bound: 0.1
    # sigma of gaussian bound between theta_E from finite-source and from xallarap orbit, in mas. default is 0.1. 
    # Only used in binary source models with xallarap. 
photometry_files:
    - file_name: data/OB170114/ob170114_I.dat
      phot_fmt: 'mag'
      add_2450000: False
      plot_properties: {zorder: 10., color: red, label: "OGLE I-band"}
      MIST_bandpass: Bessell_I #  any other bandpass available in Brutus/MIST
      ET_fit: True
    - file_name: data/OB170114/ob170114_V.dat
      phot_fmt: 'mag'
      add_2450000: False
      plot_properties: {zorder: 10., color: blue, label: "OGLE V-band"}
      MIST_bandpass: Bessell_V
      ET_fit: True

model:   
    coords: 17:21:57.74 -29:37:25.3
    methods: 2457850. VBM 2457975. 
    default method: point_source_point_lens
    methods parameters:
        VBM:
          relative_accuracy: 0.01

